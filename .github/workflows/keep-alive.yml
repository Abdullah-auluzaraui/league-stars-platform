name: Keep Alive

on:
  schedule:
    # Run every 14 minutes to keep the service and database active
    - cron: '*/14 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to ping (Leave blank to use default or repository secret/variable APP_URL)'
        required: false
        type: string

jobs:
  ping:
    name: Ping Service
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request
        env:
          INPUT_URL: ${{ inputs.target_url }}
          SECRET_URL: ${{ secrets.APP_URL }}
          VAR_URL: ${{ vars.APP_URL }}
          DEFAULT_URL: 'https://leauge-stars-rho.vercel.app/api/health'
        run: |
          TARGET_URL="${INPUT_URL:-${SECRET_URL:-${VAR_URL:-$DEFAULT_URL}}}"
          echo "============================================="
          echo "Keep-Alive Ping triggered"
          echo "Target URL : $TARGET_URL"
          echo "Timestamp  : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================="

          # Perform HTTP request
          RESPONSE=$(curl -s -L --max-time 30 -w "\n%{http_code}" "$TARGET_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status Code: $HTTP_STATUS"
          if [ -n "$BODY" ]; then
            echo "Response Body: $BODY"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Keep-alive ping successful! Service is active."
          else
            echo "::warning ::Received HTTP status code: $HTTP_STATUS"
          fi
